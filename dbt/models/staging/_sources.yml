version: 2

sources:
  - name: raw
    schema: raw
    description: "Raw data as landed from source APIs. Written by ingestion adapters."
    tables:
      - name: prices
        description: >
          Raw OHLCV price data from all sources.
          Grain: one row per (ticker, trading_date, source).
        columns:
          - name: ticker
            description: "Stock ticker symbol (e.g. AAPL)"
          - name: trading_date
            description: "The trading date in exchange-local timezone (UTC date for Polygon daily bars)"
          - name: source
            description: "Data vendor: polygon | yahoo | alpha_vantage"
          - name: close
            description: "Unadjusted closing price"
          - name: volume
            description: >
              Share volume. NUMERIC, not integral — Polygon aggregates
              fractional-share trades. Rounded to whole shares in staging.

      - name: security_identity
        description: >
          The durable surrogate key. Maps security_id to the natural key it is
          anchored on — a FIGI once resolved, a provisional vendor:ticker key
          until then. See ADR-0007.
        columns:
          - name: security_id
            description: "Durable, meaningless surrogate. Never changes, never reused."
            tests:
              - unique
              - not_null
          - name: identity_key
            description: "'figi:<FIGI>' when resolved, 'vendor_ticker:<source>:<ticker>' when provisional"
            tests:
              - unique
              - not_null
          - name: identity_kind
            description: "figi | vendor_ticker"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['figi', 'vendor_ticker']

      - name: security_master
        description: >
          CURRENT vendor snapshot of security reference data — one row per
          (security_id, source). Holds no history by design: the SCD2 snapshot
          owns the system-time axis. See ADR-0004.
        columns:
          - name: security_id
            description: "FK to raw.security_identity"
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'security_identity')
                    field: security_id
          - name: ticker
            description: "Current ticker. An ATTRIBUTE, not an identity — tickers are reused."
            tests:
              - not_null
          - name: figi
            description: "OpenFIGI composite FIGI. Free and redistributable."
          - name: cusip
            description: >
              Licensed identifier (CUSIP Global Services). NULL in this
              deployment by design — never derived or generated. See ADR-0007.
          - name: isin
            description: "Licensed identifier. NULL by design, as with cusip."
          - name: list_date
            description: "VALID-time start: when the security became tradeable. Vendor-supplied."
          - name: delist_date
            description: "VALID-time end. NULL means still listed."

      - name: corporate_actions
        description: >
          Splits and cash dividends. The sole input to the adjustment factors in
          ADR-0003. Grain: one row per (security_id, action_type, ex_date, source).
        columns:
          - name: security_id
            description: "FK to raw.security_identity"
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'security_identity')
                    field: security_id
          - name: action_type
            description: "split | dividend"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['split', 'dividend']
          - name: ex_date
            description: >
              The date the price basis changes. The only date the adjustment
              maths uses — a bar ON the ex-date already trades on the new basis.
            tests:
              - not_null
          - name: split_to
            description: "Numerator of the split ratio. NVDA 2024-06-10 was to=10, from=1."
          - name: split_from
            description: "Denominator of the split ratio."
          - name: cash_amount
            description: "Dividend per share, in `currency`."

      - name: macro_series
        description: >
          FRED series metadata. Grain: one row per (series_id, source).
          series_id is FRED's own ID used directly — no surrogate. See the
          header of migrations/0005_macro_data.sql for why the ADR-0007
          reasoning that forces a surrogate for securities does not apply here.
        columns:
          - name: series_id
            description: "FRED's native series ID, e.g. UNRATE. Permanent and never reused."
            tests:
              - not_null
          - name: units
            description: >
              What the numbers mean. Load-bearing: GDP is billions of dollars,
              UNRATE is a percent, CPIAUCSL is an index on an arbitrary
              1982-84=100 base. Nothing in the values themselves says so.
          - name: seasonal_adjustment_short
            description: >
              SA | NSA | SAAR. A seasonally adjusted and an unadjusted series of
              the same quantity are different series, and confusing them is the
              macro analogue of confusing ADR-0003's two adjusted price series.

      - name: macro_observations
        description: >
          FRED observations. Grain: one row per
          (series_id, observation_date, source).

          observation_date is the START OF THE PERIOD, not the publication date —
          January 2026's unemployment rate is dated 2026-01-01 and was first
          published 2026-02-11. first_published_date carries the real one.
        columns:
          - name: series_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'macro_series')
                    field: series_id
          - name: observation_date
            description: "Start of the period the value describes. NOT when it became known."
            tests:
              - not_null
          - name: value
            description: >
              NULL means FRED reported its '.' missing sentinel — a market
              holiday in a daily series, or a period a survey did not run.
              Never zero: DGS10 carries a '.' on 2026-07-03 and a 0.0 there is a
              ten-year Treasury yield of zero percent.
          - name: first_published_date
            description: >
              When the FIRST estimate for this period became available, from
              FRED's output_type=4 initial-release history. The column that
              makes a point-in-time join possible. NULL for calculated series
              such as T10Y2Y, which FRED tracks no releases for.
          - name: vintage_date
            description: >
              Which vintage `value` is from. `value` is the LATEST revision, so
              a join on first_published_date removes look-ahead about a number's
              existence but not about its value. See ADR-0012.
