version: 2

models:
  - name: stg_polygon__prices
    description: >
      Staged OHLCV daily bars from Polygon.io.
      Grain: one row per (ticker, trading_date).
      Source: raw.prices where source = 'polygon'.
      Type-coerced and sanity-filtered but otherwise unmodified from raw.
    columns:
      - name: ticker
        description: "Stock ticker symbol"
        tests:
          - not_null
      - name: trading_date
        description: "Trading date (UTC date per Polygon bar timestamp)"
        tests:
          - not_null
      - name: close_price
        description: "Unadjusted closing price"
        tests:
          - not_null
      - name: source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['polygon']

  - name: stg_yahoo__prices
    description: >
      Staged OHLCV daily bars from Yahoo Finance.
      Grain: one row per (ticker, trading_date).
      Source: raw.prices where source = 'yahoo'.

      NOT ON THE SAME PRICE BASIS AS stg_polygon__prices. Yahoo's chart endpoint
      back-adjusts for splits and offers no flag to disable it, so these bars are
      split-adjusted as of the moment they were fetched — KLAC's 2026-06-11 close
      is 241.164 here against Polygon's 2411.64. The de-adjustment onto the raw
      basis happens in int_prices_on_raw_basis, not here: ADR-0008 confines
      staging to renames, casts and cheap sanity filters, and raw must stay
      faithful to the vendor. See ADR-0006.

      The FALLBACK source. Polygon wins wherever it has a bar.
    columns:
      - name: ticker
        description: "Stock ticker symbol"
        tests:
          - not_null
      - name: trading_date
        description: >
          Trading date, derived by converting Yahoo's session-open timestamp to
          the exchange timezone the response declares — NOT from the UTC date.
          Yahoo stamps a daily bar at 13:30Z under EDT where Polygon stamps it at
          midnight UTC, so the two adapters need opposite handling.
        tests:
          - not_null
      - name: close_price
        description: "Closing price, on Yahoo's split-adjusted basis"
        tests:
          - not_null
      - name: vwap
        description: >
          Always NULL. Yahoo supplies no volume-weighted average price, and
          ADR-0006 refuses to fabricate one — (high+low+close)/3 would be
          plausible enough that nothing downstream could catch it.
      - name: trade_count
        description: "Always NULL. Not supplied by Yahoo. See vwap."
      - name: source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['yahoo']

  - name: stg_fred__series
    description: >
      Staged FRED series metadata. Grain: one row per series_id.
      Renaming and casting, plus a sortable frequency rank — FRED's own
      frequency strings are not orderable.
    columns:
      - name: series_id
        tests:
          - unique
          - not_null
      - name: title
        tests:
          - not_null
      - name: frequency_rank
        description: "1 (daily) to 7 (annual). NULL if FRED sends a frequency we do not map."
      - name: is_annualised_rate
        tests:
          - not_null

  - name: stg_fred__observations
    description: >
      Staged FRED observations. Grain: one row per (series_id, observation_date).

      NO sanity filter on `value`, deliberately, unlike every other staging model
      here. Macro series share no sign or range invariant — T10Y2Y is a spread
      and is legitimately negative, which is what an inverted yield curve is — so
      a `value > 0` filter copied from the price models would delete exactly the
      observations anyone cares about. And a NULL value is DATA (FRED's '.'
      sentinel), not corruption, so filtering it would make a daily series look
      gap-free while deleting every market holiday.
    columns:
      - name: series_id
        tests:
          - not_null
      - name: observation_date
        description: "Start of the period described. NOT the publication date."
        tests:
          - not_null
      - name: is_missing_observation
        description: "True where FRED reported '.'. Distinguished from 'no row at all'."
        tests:
          - not_null
      - name: publication_lag_days
        description: >
          first_published_date - observation_date. NULL for series with no
          initial-release history. Materialised because it is the size of the
          look-ahead bias a naive join would introduce, and a value left to be
          re-derived is a value nobody looks at.