[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "financial-market-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "psycopg2-binary>=2.9",
    # Both pinned to the 1.11 line on purpose — see ADR-0010.
    # dbt-postgres declares `dbt-core>=1.8.0rc1`; a pre-release in a specifier
    # makes pip eligible to install pre-releases of that package, which is how an
    # unbounded `dbt-postgres>=1.7` silently resolved dbt-core to 1.12.0b3.
    # 1.12.0 is not the fix: it hard-requires dbt-core-experimental-parser>=2.0.0a4,
    # itself an alpha. 1.11.x is the newest line whose full tree is stable.
    "dbt-core>=1.11,<1.12",
    "dbt-postgres>=1.11,<1.12",
    "requests>=2.31",
    "truststore>=0.10",
    "tenacity>=8.0",
    "pyarrow>=16.0",
    "pandas>=2.0",
    "exchange-calendars>=4.5",
    "streamlit>=1.36",
    # Charting for the dashboard. Streamlit bundles Altair, which would have
    # served the line charts, but not the two things this dashboard needs most:
    # dated vertical annotations with labels (corporate actions on a price
    # series) and a range selector. Pinned above 5.20 for `add_vline` accepting
    # a date-typed x, which is what the annotation layer is built on.
    "plotly>=5.20",
    # 3.x, not the previous unbounded >=2.19. The deployment API differs
    # materially between the two lines — `prefect deploy` / work pools / the
    # `flow.serve` model are all 3.x shapes — so an unbounded floor would have
    # resolved to either and silently broken orchestration/. See ADR-0005.
    "prefect>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "responses>=0.25",
    "ruff>=0.4",
    # <2.0: mypy 2.x requires pathspec>=1.0, dbt-core requires pathspec<0.13.
    "mypy>=1.9,<2.0",
    # scripts/dbt.ps1 shells out to dotenv.exe, which only exists with the [cli]
    # extra. It was previously present by accident, as a transitive dependency of
    # pydantic-settings — which pulls the library but not the console script's
    # click dependency. Declared explicitly so the wrapper cannot silently break.
    "python-dotenv[cli]>=1.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: needs the Docker stack, network, and a real API key. Deselect with -m 'not integration'.",
    # Declared rather than left to an incidental skipif. CI has no vendor keys, so
    # a test guarded only by skipif(not settings.polygon_api_key) would skip itself
    # silently — and the NEXT live-vendor test someone writes would not have that
    # guard, would not be noticed, and would make real network calls from a runner.
    # `-m 'not live_vendor'` makes the boundary opt-out rather than remember-to-add.
    # See ADR-0013.
    "live_vendor: calls a real vendor API. NEVER runs in CI — a vendor outage or a rate limit would turn CI red for a reason outside the diff. Run locally with -m live_vendor.",
]