[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "financial-market-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "psycopg2-binary>=2.9",
    # Both pinned to the 1.11 line on purpose — see ADR-0010.
    # dbt-postgres declares `dbt-core>=1.8.0rc1`; a pre-release in a specifier
    # makes pip eligible to install pre-releases of that package, which is how an
    # unbounded `dbt-postgres>=1.7` silently resolved dbt-core to 1.12.0b3.
    # 1.12.0 is not the fix: it hard-requires dbt-core-experimental-parser>=2.0.0a4,
    # itself an alpha. 1.11.x is the newest line whose full tree is stable.
    "dbt-core>=1.11,<1.12",
    "dbt-postgres>=1.11,<1.12",
    "requests>=2.31",
    "truststore>=0.10",
    "tenacity>=8.0",
    "pyarrow>=16.0",
    "pandas>=2.0",
    "exchange-calendars>=4.5",
    "streamlit>=1.33",
    "prefect>=2.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "responses>=0.25",
    "ruff>=0.4",
    # <2.0: mypy 2.x requires pathspec>=1.0, dbt-core requires pathspec<0.13.
    "mypy>=1.9,<2.0",
    # scripts/dbt.ps1 shells out to dotenv.exe, which only exists with the [cli]
    # extra. It was previously present by accident, as a transitive dependency of
    # pydantic-settings — which pulls the library but not the console script's
    # click dependency. Declared explicitly so the wrapper cannot silently break.
    "python-dotenv[cli]>=1.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: needs the Docker stack, network, and a real API key. Deselect with -m 'not integration'.",
]