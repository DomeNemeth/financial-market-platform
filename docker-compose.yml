volumes:
  postgres_data:

services:

  postgres:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Published on 5433 because a native Windows PostgreSQL 18 service
      # (postgresql-x64-18) already owns host port 5432. Container-internal
      # port stays 5432 — only the host-side mapping changes.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env
    environment:
      # Override POSTGRES_HOST for container networking.
      # Inside Docker, containers reach each other by service name, not localhost.
      POSTGRES_HOST: postgres
      # Override POSTGRES_PORT for the same reason: .env carries the host-side
      # port (5433) for pytest/dbt, but inside the Docker network Postgres is
      # still listening on its native 5432.
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      uvicorn src.api.main:app
      --host 0.0.0.0
      --port 8000
      --reload