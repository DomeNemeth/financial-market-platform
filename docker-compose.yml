volumes:
  postgres_data:

services:

  postgres:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Published on 5433 because a native Windows PostgreSQL 18 service
      # (postgresql-x64-18) already owns host port 5432. Container-internal
      # port stays 5432 — only the host-side mapping changes.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env
    environment:
      # Override POSTGRES_HOST for container networking.
      # Inside Docker, containers reach each other by service name, not localhost.
      POSTGRES_HOST: postgres
      # Override POSTGRES_PORT for the same reason: .env carries the host-side
      # port (5433) for pytest/dbt, but inside the Docker network Postgres is
      # still listening on its native 5432.
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      uvicorn src.api.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    environment:
      # The dashboard's ONLY connection to data. It has no POSTGRES_* variables
      # here and that is the point: it holds no database credentials, so there
      # is exactly one implementation of "which security is this ticker" and the
      # UI cannot go around it. See src/dashboard/api_client.py.
      #
      # `app`, not localhost — containers reach each other by service name, the
      # same reason the app service overrides POSTGRES_HOST above.
      API_BASE_URL: http://app:8000
      # Deliberately NOT env_file: .env. Loading it would hand this container
      # POSTGRES_PASSWORD and POLYGON_API_KEY for no reason; a thin client that
      # is given credentials it does not need is one refactor away from using
      # them.
      DASHBOARD_TICKERS: AAPL,JPM,KLAC,MSFT,NVDA,V
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
      - ./.streamlit:/app/.streamlit
    depends_on:
      # Waits for the container, not for readiness — the API has no healthcheck.
      # Harmless here: every page renders its own "API not reachable" state
      # rather than crashing, so a dashboard that starts first shows that panel
      # and recovers on the next rerun.
      - app
    command: >
      streamlit run src/dashboard/app.py
      --server.address 0.0.0.0
      --server.port 8501